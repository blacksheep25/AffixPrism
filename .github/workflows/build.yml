name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core checks
        run: dotnet run --project tests/AffixPrism.Tests -c Release
      - name: Build desktop
        run: dotnet build src/AffixPrism -c Release --nologo
      - name: Build optional service
        run: dotnet build src/AffixPrism.MarketService -c Release --nologo
